# Increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties — these are the versions that actually exist for MC 26.1.2.
# Verify anytime at https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod properties
version=3.4.0
group=com.foxclient

# Dependencies
# Fabric API for 26.1.2. Note 26.1 renamed huge parts of Fabric API to match
# Mojang's official names (e.g. WorldRenderEvents -> LevelRenderEvents).
fabric_api_version=0.155.3+26.1.2
