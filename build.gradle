plugins {
	// NOTE (26.1+): this is the NEW unobfuscated Loom plugin — NOT the old
	// 'fabric-loom' / 'fabric-loom-remap' plugin. It does not remap Minecraft
	// or your mod, and therefore:
	//   - there is no `mappings` dependency (Minecraft 26.1+ ships unobfuscated)
	//   - `modImplementation` / `modCompileOnly` / `modRuntimeOnly` do not exist,
	//     use plain `implementation` / `compileOnly` / `runtimeOnly`
	//   - there is no `remapJar` task, the normal `jar` task is the deliverable
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The jar you ship carries the version in its own name: FoxClientv3.4.0.jar. The mod id stays
// 'foxclient' and the display name stays FoxClientv2.0 - only the file name changes, so the download
// and the build output always agree with the version inside. Setting archiveFileName directly avoids
// Gradle appending the version a second time.
tasks.named('jar', Jar) {
	archiveFileName = "FoxClientv${project.version}.jar"
}

repositories {
	// Loom adds the Minecraft/Fabric mavens automatically. Add extra repos here
	// only when depending on third-party mods.
}

loom {
	// Keeps client-only code in its own source set so the server can never
	// accidentally load it, and so client classes are compile-time safe.
	splitEnvironmentSourceSets()

	mods {
		"foxclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Plain `implementation`, NOT `modImplementation` — see the note above.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// 26.1 requires Java 25.
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
